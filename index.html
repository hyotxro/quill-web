<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUILL Studio — Editor visual</title><style>
:root{--ink:#111;--sky:#a5e5ee}*{box-sizing:border-box}body{font:15px Arial,sans-serif;background:#f5f5f1;color:#111;margin:0}header{padding:16px 22px;background:var(--sky);border-bottom:3px solid #111;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:30px;letter-spacing:-2px;margin:0}button,.btn{background:white;border:2px solid #111;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:800;font-size:14px}button:hover{background:#dff6f9}.primary{background:#111;color:white}.primary:hover{background:#333}button:disabled{opacity:.4;cursor:not-allowed}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 80px)}aside{border-right:2px solid #111;background:white;padding:22px;display:flex;flex-direction:column;gap:10px}aside button{text-align:left}aside button.active{background:var(--sky)}main{padding:24px;max-width:1080px;width:100%;margin:auto}h2{font-size:35px;letter-spacing:-1.5px;margin:0 0 12px}p{line-height:1.5}.panel{background:white;border:2px solid #111;border-radius:10px;padding:20px;margin:16px 0;box-shadow:4px 4px 0 #111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.card{border:2px solid #111;background:#fff;padding:10px;cursor:pointer;text-align:left}.card img{width:100%;height:220px;object-fit:cover;object-position:top;background:#eee}.card b{display:block;padding:7px 0}label{font-weight:800;display:block;margin:12px 0 5px}input,textarea,select{font:inherit;border:2px solid #111;border-radius:6px;padding:10px;width:100%;background:white}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.hint{color:#555;font-size:13px}.preview{max-width:250px;max-height:350px;object-fit:contain;border:2px solid #111;background:#eee}.pageitem{display:flex;gap:12px;align-items:center;border:2px solid #111;padding:9px;margin:8px 0;background:#fff}.pageitem img{width:62px;height:90px;object-fit:cover}.pageitem strong{flex:1}.notice{padding:14px;background:#e0f6f9;border-left:5px solid #111}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#status{font-size:13px;font-weight:bold}@media(max-width:720px){.layout{display:block}aside{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid #111;padding:10px}aside button{flex:1}main{padding:14px}h2{font-size:29px}}
</style></head><body><header><h1>QUILL <span style="font-weight:400">STUDIO ✎</span></h1><div class="row"><span id="status">Cargando...</span><button onclick="saveDraft()">Guardar borrador</button><button class="primary" onclick="exportSite()">⬇ Exportar web ZIP</button></div></header><div class="layout"><aside><button data-tab="home" class="active">⌂ Inicio</button><button data-tab="chapters">▤ Capítulos</button><button data-tab="days">▦ Merachotober</button><button data-tab="identity">✎ Identidad</button><button data-tab="help">? Cómo publicar</button><hr style="width:100%"><a href="../index.html" target="_blank">↗ Ver web pública</a></aside><main id="main"></main></div><input id="filepicker" type="file" accept="image/*" multiple hidden><script>
'use strict';let data=null,files={},tab='home',editing=null,dirty=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const clone=o=>JSON.parse(JSON.stringify(o));
// IndexedDB almacena borradores e imágenes grandes sin límite estricto de localStorage.
const DB=new Promise((resolve,reject)=>{let r=indexedDB.open('quill-studio-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});async function dbGet(k){let db=await DB;return new Promise((res,rej)=>{let r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function dbSet(k,v){let db=await DB;return new Promise((res,rej)=>{let t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function status(s){$('status').textContent=s}function touch(){dirty=true;status('● Cambios sin exportar');dbSet('draft',{data,files}).catch(()=>status('Error al guardar borrador'))}async function saveDraft(){await dbSet('draft',{data,files});dirty=false;status('✓ Borrador guardado en este navegador')}
async function init(){try{let r=await fetch('../data.json',{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar data.json');let base=await r.json();let draft=await dbGet('draft');if(draft&&confirm('Hay un borrador guardado en este navegador. ¿Quieres recuperarlo?')){data=draft.data;files=draft.files||{}}else data=base;status('✓ Editor listo');show('home')}catch(e){status('Error');$('main').innerHTML='<div class="panel"><h2>No se puede abrir el editor</h2><p>Ábrelo desde tu URL de GitHub Pages, no mediante doble clic en el archivo.</p><p>'+esc(e.message)+'</p></div>'}}function show(t){tab=t;editing=null;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function render(){if(tab==='home')return home();if(tab==='identity')return identity();if(tab==='chapters'||tab==='days')return listing();help()}
function home(){$('main').innerHTML=`<h2>Bienvenido al nido.</h2><div class="notice">Aquí puedes organizar las ilustraciones sin tocar JSON. Los cambios se guardan como borrador en este navegador. Para publicar, descarga el ZIP y súbelo a GitHub.</div><div class="grid"><div class="panel"><h2>${data.chapters.length}</h2><b>Capítulos</b><p>Historias del webcómic principal.</p><button onclick="show('chapters')">Administrar →</button></div><div class="panel"><h2>${data.days.length}/31</h2><b>Merachotober</b><p>Dibujos del reto diario.</p><button onclick="show('days')">Administrar →</button></div></div><div class="panel"><h3>Antes de publicar</h3><p>Las imágenes originales incluidas se conservan. El editor exporta un ZIP completo con los cambios. Tu sitio público no se modifica hasta que subas los archivos a GitHub.</p></div>`}
function identity(){$('main').innerHTML=`<h2>Identidad de QUILL</h2><div class="panel"><label>Título</label><input data-site="title" value="${esc(data.site.title)}"><label>Subtítulo</label><input data-site="subtitle" value="${esc(data.site.subtitle)}"><label>Autor</label><input data-site="author" value="${esc(data.site.author)}"><label>Introducción</label><textarea data-site="intro">${esc(data.site.intro)}</textarea><label>Biografía</label><textarea data-site="about">${esc(data.site.about)}</textarea><label>Color principal</label><input type="color" data-site="accent" value="${esc(data.site.accent)}"></div>`;document.querySelectorAll('[data-site]').forEach(x=>x.oninput=()=>{data.site[x.dataset.site]=x.value;touch()})}
function listing(){let day=tab==='days',arr=day?data.days:data.chapters;$('main').innerHTML=`<h2>${day?'Merachotober':'Capítulos'}</h2><p>${day?'Selecciona un día y cambia su imagen o descripción.':'Cada capítulo puede tener varias páginas; usa las flechas para ordenarlas.'}</p><div class="actions"><button class="primary" id="add">＋ ${day?'Añadir día':'Nuevo capítulo'}</button></div><div class="grid" id="cards"></div>`;$('add').onclick=()=>{if(day){let used=new Set(data.days.map(x=>x.day));let n=Array.from({length:31},(_,i)=>i+1).find(n=>!used.has(n));if(!n)return alert('Ya están los 31 días');let o={day:n,word:'',title:'',description:'',image:'',status:'borrador'};data.days.push(o);touch();edit(n)}else{let o={id:'c'+Date.now(),title:'Nuevo capítulo',subtitle:'',description:'',status:'borrador',cover:'',pages:[]};data.chapters.push(o);touch();edit(o.id)}};for(const item of arr.slice().sort((a,b)=>day?a.day-b.day:0)){let b=document.createElement('button');b.className='card';let src=day?item.image:item.cover;b.innerHTML=`${src?`<img src="${esc(src)}" alt="">`:''}<b>${day?'DÍA '+item.day+' · '+esc(item.word):esc(item.title)}</b><small>${esc(item.status)}</small>`;b.onclick=()=>edit(day?item.day:item.id);$('cards').append(b)}}
function edit(key){editing=key;let day=tab==='days',arr=day?data.days:data.chapters,o=arr.find(x=>(day?x.day:x.id)===key);if(!o)return;let props=day?`<label>Palabra del día</label><input data-field="word" value="${esc(o.word)}"><label>Título opcional</label><input data-field="title" value="${esc(o.title)}">`:`<label>Título</label><input data-field="title" value="${esc(o.title)}"><label>Etiqueta</label><input data-field="subtitle" value="${esc(o.subtitle)}">`;let src=day?o.image:o.cover;$('main').innerHTML=`<div class="actions"><button id="back">← Volver</button><button id="remove">Eliminar entrada</button></div><h2>${day?'Día '+o.day:esc(o.title)}</h2><div class="panel">${props}<label>Descripción</label><textarea data-field="description">${esc(o.description)}</textarea><label>Estado</label><select data-field="status"><option value="borrador">Borrador (oculto)</option><option value="publicado">Publicado</option></select><label>${day?'Ilustración':'Portada'}</label><div id="coverPreview">${src?`<img class="preview" src="${esc(src)}">`:'Sin imagen todavía'}</div><div class="actions"><button id="upload">↑ Subir imagen</button></div></div>${day?'':`<div class="panel"><h3>Páginas del capítulo</h3><p class="hint">Se muestran de arriba abajo. Usa ↑ ↓ para ordenar. Puedes subir varias imágenes de una vez.</p><div id="pagelist"></div><button id="addpages">＋ Subir páginas</button></div>`}`;$('back').onclick=()=>listing();$('remove').onclick=()=>{if(confirm('¿Eliminar esta entrada del catálogo?')){arr.splice(arr.indexOf(o),1);touch();listing()}};document.querySelectorAll('[data-field]').forEach(el=>{el.value=o[el.dataset.field]||'';el.oninput=()=>{o[el.dataset.field]=el.value;touch()}});$('upload').onclick=()=>chooseImages(false,paths=>{if(day)o.image=paths[0];else o.cover=paths[0];touch();edit(key)});if(!day){$('addpages').onclick=()=>chooseImages(true,paths=>{o.pages.push(...paths);if(!o.cover)o.cover=paths[0];touch();edit(key)});drawPages(o)}}
function drawPages(o){let el=$('pagelist');el.innerHTML='';o.pages.forEach((p,i)=>{let row=document.createElement('div');row.className='pageitem';row.innerHTML=`<img src="${esc(p)}"><strong>Página ${i+1}</strong><button aria-label="Subir página">↑</button><button aria-label="Bajar página">↓</button><button aria-label="Eliminar página">✕</button>`;let b=row.querySelectorAll('button');b[0].disabled=i===0;b[1].disabled=i===o.pages.length-1;b[0].onclick=()=>{[o.pages[i-1],o.pages[i]]=[o.pages[i],o.pages[i-1]];touch();drawPages(o)};b[1].onclick=()=>{[o.pages[i+1],o.pages[i]]=[o.pages[i],o.pages[i+1]];touch();drawPages(o)};b[2].onclick=()=>{o.pages.splice(i,1);touch();drawPages(o)};el.append(row)})}
function chooseImages(multiple,cb){let input=$('filepicker');input.multiple=multiple;input.value='';input.onchange=async()=>{let paths=[];for(const f of input.files){if(!f.type.startsWith('image/'))continue;let path='assets/upload-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+slug(f.name.replace(/\.[^.]+$/,''))+'.'+(f.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'')||'png');files[path]=await f.arrayBuffer();paths.push(path)}if(paths.length)cb(paths)};input.click()}
function help(){$('main').innerHTML=`<h2>Publicar sin programar</h2><div class="panel"><h3>1. Edita tu contenido</h3><p>Agrega imágenes, cambia títulos y marca «Publicado» cuando quieras que una entrada sea visible.</p><h3>2. Exporta el ZIP</h3><p>Pulsa «Exportar web ZIP». Incluye la página pública, el editor, las imágenes y el JSON actualizado.</p><h3>3. Sube los archivos a GitHub</h3><p>Descomprime el ZIP en tu equipo. En el repositorio de GitHub usa «Add file → Upload files» y arrastra los archivos y carpetas del ZIP. Confirma los cambios. GitHub Pages publicará la nueva versión.</p><h3>Importante</h3><p>El editor no tiene contraseña: cualquiera con el enlace puede abrirlo, pero no puede modificar tu repositorio sin permisos de GitHub. Los borradores guardados en este navegador no son una copia de seguridad: exporta el ZIP periódicamente. No subas contenido privado o contraseñas al repositorio público.</p></div>`}
// ZIP sin bibliotecas ni servidores externos. Archivos STORE (sin compresión), válidos para GitHub.
const enc=new TextEncoder();function crc32(a){let c=0xffffffff;for(let v of a){c^=v;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xedb88320:c>>>1}return(c^0xffffffff)>>>0}function zip(entries){let local=[],central=[],offset=0;for(let [name,bytes] of entries){let nm=enc.encode(name),len=bytes.length,crc=crc32(bytes),h=new Uint8Array(30+nm.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,len,true);v.setUint32(22,len,true);v.setUint16(26,nm.length,true);h.set(nm,30);local.push(h,bytes);let ch=new Uint8Array(46+nm.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint32(16,crc,true);cv.setUint32(20,len,true);cv.setUint32(24,len,true);cv.setUint16(28,nm.length,true);cv.setUint32(42,offset,true);ch.set(nm,46);central.push(ch);offset+=h.length+len}let size=central.reduce((s,a)=>s+a.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);ev.setUint32(12,size,true);ev.setUint32(16,offset,true);return new Blob([...local,...central,end],{type:'application/zip'})}
async function exportSite(){try{status('Preparando ZIP...');await saveDraft();let paths=new Set(['index.html','studio/index.html',...Object.keys(files)]);function allImages(){let s=new Set();for(let x of data.chapters){if(x.cover)s.add(x.cover);for(let p of x.pages||[])s.add(p)}for(let x of data.days)if(x.image)s.add(x.image);return s}for(let p of allImages())paths.add(p);let entries=[['data.json',enc.encode(JSON.stringify(data,null,2))]];for(let path of paths){if(files[path])entries.push([path,new Uint8Array(files[path])]);else{let url=path==='index.html'?'../index.html':path==='studio/index.html'?'./index.html':'../'+path;let r=await fetch(url);if(!r.ok)throw Error('No se encontró '+path);entries.push([path,new Uint8Array(await r.arrayBuffer())])}}let blob=zip(entries),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='QUILL-web-actualizada.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),20000);status('✓ ZIP exportado: súbelo a GitHub')}catch(e){status('Error de exportación');alert('No se pudo exportar: '+e.message)}}init();
</script></body></html>
